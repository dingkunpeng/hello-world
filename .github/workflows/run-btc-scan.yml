name: Run BTC candidate validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'scan_btc_30m.py'
      - 'inspect_okx_candidate005.py'
      - 'inspect_okx_tbt_candidate005.py'
      - 'candidate005_crossvenue_trade_matrix.py'
      - '.github/workflows/run-btc-scan.yml'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests
      - name: Inspect OKX tick-by-tick Candidate 005
        run: python inspect_okx_tbt_candidate005.py
      - name: Build Kraken and Coinbase Candidate 005 matrix
        run: python candidate005_crossvenue_trade_matrix.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/candidate005_okx_tbt/ output/candidate005_crossvenue/
          git commit -m 'Add Candidate 005 cross-venue latency evidence' || exit 0
          git push
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: candidate005-crossvenue
          path: |
            output/candidate005_okx_tbt/
            output/candidate005_crossvenue/
