name: Run BTC 2026 30m scan

on:
  workflow_dispatch:
  push:
    paths:
      - 'scan_btc_30m.py'
      - 'inspect_okx_candidate005.py'
      - '.github/workflows/run-btc-scan.yml'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests
      - name: Run full scan
        run: python scan_btc_30m.py
      - name: Inspect OKX Candidate 005 archive
        run: python inspect_okx_candidate005.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/
          git commit -m 'Update BTC scan and Candidate 005 OKX results' || exit 0
          git push
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-2026-30m-scan
          path: output/
