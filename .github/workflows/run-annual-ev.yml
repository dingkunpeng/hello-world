name: Run annual EV triage

on:
  workflow_dispatch:
  push:
    paths:
      - 'annual_1m_triage.py'
      - '.github/workflows/run-annual-ev.yml'

permissions:
  contents: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Run annual 1m triage
        run: python annual_1m_triage.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/annual_ev/
          git commit -m 'Add annual 1m EV triage results' || exit 0
          git push
