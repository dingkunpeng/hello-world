name: Run dynamic cancel sample days
on:
  push:
    paths:
      - '.github/workflows/run-dynamic-cancel-sample.yml'
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Replay worst, mixed, best sample days
        run: |
          python exact_dynamic_cancel_risk_day.py --date 2026-02-05
          python exact_dynamic_cancel_risk_day.py --date 2026-02-07
          python exact_dynamic_cancel_risk_day.py --date 2026-07-20
      - name: Commit sample results
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add output/dynamic_cancel_risk_exact/2026-02-05 output/dynamic_cancel_risk_exact/2026-02-07 output/dynamic_cancel_risk_exact/2026-07-20
          git diff --cached --quiet || git commit -m 'Add dynamic cancel sample results'
          git push
