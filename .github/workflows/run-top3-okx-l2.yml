name: Validate top three with OKX L2

on:
  workflow_dispatch:
  push:
    paths:
      - 'validate_top3_okx_l2.py'
      - '.github/workflows/run-top3-okx-l2.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Validate top three OKX L2
        run: python validate_top3_okx_l2.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/annual_ev/top3_okx_l2/
          git commit -m 'Add top three OKX L2 annual validation' || exit 0
          git push
