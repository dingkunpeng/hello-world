name: Run optimized dynamic cancel sample
on:
  push:
    paths:
      - '.github/workflows/run-dynamic-cancel-sample-fast.yml'
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Patch equivalent O(1) minute lookup
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('exact_dynamic_cancel_risk_day.py')
          s=p.read_text()
          s=s.replace("targets=[(m['start_ms'],m['start_ms']+60000) for m in mins]", "target_minutes={m['start_ms'] for m in mins}")
          s=s.replace("if any(a<=t<b for a,b in targets):", "if minute_start(t) in target_minutes:")
          p.write_text(s)
          PY
      - name: Replay representative sample days
        run: |
          python exact_dynamic_cancel_risk_day.py --date 2026-02-05
          python exact_dynamic_cancel_risk_day.py --date 2026-02-07
          python exact_dynamic_cancel_risk_day.py --date 2026-07-20
      - name: Commit sample results
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add output/dynamic_cancel_risk_exact/2026-02-05 output/dynamic_cancel_risk_exact/2026-02-07 output/dynamic_cancel_risk_exact/2026-07-20
          git diff --cached --quiet || git commit -m 'Add optimized dynamic cancel sample results'
          git push
