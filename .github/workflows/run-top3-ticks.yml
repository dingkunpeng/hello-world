name: Locate top three Binance ticks

on:
  workflow_dispatch:
  push:
    paths:
      - 'locate_top3_binance_ticks.py'
      - '.github/workflows/run-top3-ticks.yml'

permissions:
  contents: write

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python locate_top3_binance_ticks.py
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/annual_ev/top3_ticks/
          git commit -m 'Add top three Binance tick locations' || exit 0
          git push
