name: Run remaining standardized L2 annual replay
on:
  push:
    paths:
      - 'validate_remaining_l2_standardized.py'
      - '.github/workflows/run-remaining-l2-standardized.yml'
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Run remaining standardized replay
        run: python validate_remaining_l2_standardized.py
      - name: Commit results
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add output/annual_ev/remaining_l2
          git diff --cached --quiet || git commit -m 'Add remaining standardized L2 annual replay results'
          git push
